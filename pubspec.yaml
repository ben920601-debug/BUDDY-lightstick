name: lightstick_controller
description: GFRIEND Lightstick控制APP
publish_to: 'none'
version: 1.0.2+8

environment:
  sdk: '>=3.0.0 <4.0.0'
 
dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.32.12
  permission_handler: ^12.0.3
  record: ^6.0.0
  fftea: ^1.5.0+1
  audio_session: ^0.2.0
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
  http: ^1.2.2
  shared_preferences: ^2.3.2
 
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
 
flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
 
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  background_color_ios: "#F4E9CE"